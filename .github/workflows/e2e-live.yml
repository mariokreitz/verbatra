name: E2E (live)

# Live tier: drives translate and watch against a real provider, so it needs GEMINI_API_KEY.
# It never triggers on pull_request, so the secret is only ever exposed to already-merged or
# maintainer-triggered code. The live-e2e environment gates the job, and the secret is scoped
# to the final test step only, so the install, build, and pack steps never see it.
#
# ADVISORY, by design: this workflow never gates a publish. Its outcome depends on a third party's
# rate limiter, and release.yml keys on the CI workflow's conclusion alone, so a provider outage
# can never block shipping. The deterministic no-key tier in ci.yml is the required gate.
#
# Advisory is not the same as ignorable. The suite now reads each run's `--json` record and reports
# a rate-limited, SDK-withheld key as a skipped test rather than a failure, so this workflow no
# longer goes red for quota. A red run here means the CLI is genuinely broken against a real
# provider, and must be investigated before the next release.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-live:
    name: Drive the CLI against a live provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Enable corepack and activate pnpm
        run: corepack enable && corepack prepare pnpm@11.6.0 --activate

      - name: Compute pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack the published tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/sdk pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/cli pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/studio pack --pack-destination "$RUNNER_TEMP/packs"
          echo "VERBATRA_SDK_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-sdk-*.tgz)" >> "$GITHUB_ENV"
          echo "VERBATRA_CLI_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-cli-*.tgz)" >> "$GITHUB_ENV"
          echo "VERBATRA_STUDIO_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-studio-*.tgz)" >> "$GITHUB_ENV"

      - name: Install e2e harness dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Typecheck e2e harness
        working-directory: e2e
        run: npm run typecheck

      - name: Run full E2E suite (no-key and live)
        id: suite
        working-directory: e2e
        run: npm test
        env:
          E2E_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Says on the run itself what this tier is for and what its result means, so nobody has to
      # reconstruct the gating policy from the workflow file. The outcome arrives through env
      # rather than direct interpolation, keeping the expression out of the shell.
      #
      # The warning fires on "failure" specifically, never on "not success". A step that never ran
      # because an earlier one failed (a flaky install, a build error) has an empty outcome, and
      # blaming the CLI for that would make this warning exactly the noise it exists to replace.
      - name: Report what this tier's result means
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          {
            echo "## E2E (live)"
            echo
            echo "Result: \`${SUITE_OUTCOME:-not reached, an earlier step failed}\`."
            echo
            echo "This tier is advisory and never gates a publish. The required release gate is the"
            echo "deterministic no-key tier, reported as \"Build and test gate\" on the CI workflow."
            echo
            echo "A provider rate limit is reported as a skipped test, not a failure, so a failure"
            echo "here means the CLI is genuinely broken against a real provider."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUITE_OUTCOME" = "failure" ]; then
            echo "::warning title=Live E2E failed::The CLI failed against a real provider for a reason other than throttling. Investigate before the next release."
          fi
