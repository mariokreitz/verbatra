name: Docs i18n check

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/messages/**"
      - "apps/docs/content/docs/**"
      - "apps/docs/verbatra.config.ts"
      - "apps/docs/verbatra.lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-i18n-check:
    name: Docs i18n check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check docs locales for drift
        uses: verbatra/action@ad457e294b7f7bfbf2afa03aa17a2132f0e1f57c # v1.1.2
        with:
          version: "0.9.0"
          command: "check"
          working-directory: "apps/docs"
