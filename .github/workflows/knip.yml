name: Unused code

# Reports unused files, exports and dependencies (knip.config.ts). Informational only, and
# deliberately its own workflow rather than a job in ci.yml: release.yml fires on workflow_run for
# the "CI" workflow and publishes only when that run's conclusion is success, so any job living
# there can block a publish even when it is absent from the gate job's needs list. Keeping knip
# outside CI means a finding, or an infrastructure hiccup in this workflow, can never gate a merge
# or a release. `--no-exit-code` keeps the step green so the findings read as a report rather than
# as a failure; read them in the step log.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Enable corepack and activate pnpm
        run: corepack enable && corepack prepare pnpm@11.6.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report unused files, exports and dependencies
        run: pnpm knip --no-exit-code
